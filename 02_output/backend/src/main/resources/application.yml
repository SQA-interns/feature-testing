spring:
  application:
    name: registration-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/registration
    username: registration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: localhost
    port: 1025
    default-encoding: UTF-8
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  mvc:
    problemdetails:
      enabled: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false
  # Client address and scheme from X-Forwarded-* only for TRUSTED_PROXIES (regex of proxy IPs)
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${TRUSTED_PROXIES:none}
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false

app:
  environment: ${APP_ENVIRONMENT:local}
  conference-name: ${CONFERENCE_NAME:Conference}
  mail-from: ${MAIL_FROM:registration@konferenca.si}
  config-file: ${CONFERENCE_CONFIG_FILE:}
  json-copy-dir: ${JSON_COPY_DIR:./data/json-copies}
  cors-allowed-origin: ${CORS_ALLOWED_ORIGIN:}
  rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:60}
  request-max-bytes: ${REQUEST_MAX_BYTES:16384}
  organizer:
    username: ${ORGANIZER_USERNAME}
    password: ${ORGANIZER_PASSWORD}
    emails: ${ORGANIZER_EMAILS:}
    https-only: ${ORGANIZER_HTTPS_ONLY:true}
  captcha:
    test-mode: ${CAPTCHA_TEST_MODE:false}
    site-key: ${RECAPTCHA_SITE_KEY:}
    secret-key: ${RECAPTCHA_SECRET_KEY:}
    verify-url: ${RECAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}
